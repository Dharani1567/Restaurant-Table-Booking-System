openapi: 3.0.0

info:
  title: Restaurant Table Booking System - Authentication API
  version: 1.0.0
  description: |
    Authentication APIs for the Restaurant Table Booking System.

    Features:
      - User Registration
      - User Login
      - Forgot Password
      - Refresh Access Token

servers:
  - url: http://localhost:5000/api/v1
    description: Development Server

tags:
  - name: Authentication
    description: User authentication endpoints

paths:

  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      description: Creates a new customer account.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'

            example:
              name: Dharani
              email: dharanikan1567parthi@gmail.com
              password: qwert
              

      responses:
        '201':
          description: User registered successfully

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'

              example:
                message: Registration successful
                userId: 101

        '400':
          $ref: '#/components/responses/BadRequest'

        '409':
          description: Email already exists

          content:
            application/json:
              example:
                message: Email already registered

  /auth/login:
    post:
      tags:
        - Authentication

      summary: Login user

      description: Authenticates user credentials and returns JWT tokens.

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'

            example:
              email: dharanikan1567parthi
              password: qwert

      responses:

        '200':
          description: Login successful

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

              example:
                accessToken: eyJhbGciOi...
                refreshToken: eyJhbGciOi...
                expiresIn: 3600

        '401':
          description: Invalid credentials

          content:
            application/json:
              example:
                message: Invalid email or password

  /auth/forgot-password:
    post:
      tags:
        - Authentication

      summary: Forgot Password

      description: Sends password reset link to registered email.

      requestBody:
        required: true

        content:
          application/json:

            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'

            example:
              email: alice@example.com

      responses:

        '200':
          description: Reset email sent

          content:
            application/json:
              example:
                message: Password reset link sent

        '404':
          description: User not found

          content:
            application/json:
              example:
                message: Email not registered

  /auth/refresh-token:
    post:

      tags:
        - Authentication

      summary: Refresh JWT Access Token

      description: Generates a new access token using a valid refresh token.

      requestBody:

        required: true

        content:
          application/json:

            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'

            example:
              refreshToken: eyJhbGciOi...

      responses:

        '200':

          description: New access token generated

          content:
            application/json:

              example:
                accessToken: eyJhbGciOi...
                expiresIn: 3600

        '401':
          description: Invalid or expired refresh token

          content:
            application/json:
              example:
                message: Refresh token expired

components:

  schemas:

    RegisterRequest:
      type: object

      required:
        - name
        - email
        - password

      properties:

        name:
          type: string

        email:
          type: string
          format: email

        password:
          type: string
          format: password

    RegisterResponse:
      type: object

      properties:

        message:
          type: string

        userId:
          type: integer

    LoginRequest:
      type: object

      required:
        - email
        - password

      properties:

        email:
          type: string
          format: email

        password:
          type: string
          format: password

    LoginResponse:
      type: object

      properties:

        accessToken:
          type: string

        refreshToken:
          type: string

        expiresIn:
          type: integer

    ForgotPasswordRequest:
      type: object

      required:
        - email

      properties:

        email:
          type: string
          format: email

    RefreshTokenRequest:
      type: object

      required:
        - refreshToken

      properties:

        refreshToken:
          type: string

  responses:

    BadRequest:

      description: Invalid request

      content:
        application/json:

          example:
            message: Invalid request data

securitySchemes:

  bearerAuth:
    type: http
    scheme: bearer
    bearerFormat: JWT
